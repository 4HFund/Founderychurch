<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blessing Basket | ChurchBuilt AAA Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b0e; --bg-light: #1f252e;
            --brand-orange: #d96c06; --brand-gold: #f5b700;
            --brand-cream: #fdfbf7; --brand-cream-dim: rgba(253, 251, 247, 0.7);
            --bad-red: #cc0000; --power-blue: #00e5ff;
            --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; color: var(--brand-cream); }
        #game-wrapper { position: relative; width: 100vw; height: 100vh; max-width: 600px; background: radial-gradient(circle at top, var(--bg-light) 0%, var(--bg-dark) 100%); overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 25px; display: flex; justify-content: space-between; opacity: 0; transition: var(--transition-smooth); pointer-events: auto; }
        .hud.active { opacity: 1; }
        .score-val { color: var(--brand-gold); font-size: 2rem; font-weight: 900; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 11, 14, 0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; opacity: 0; pointer-events: none; transition: 0.4s; transform: scale(1.1); backdrop-filter: blur(15px); }
        .screen.active { opacity: 1; pointer-events: auto; transform: scale(1); }
        .btn { background: linear-gradient(135deg, var(--brand-gold) 0%, var(--brand-orange) 100%); border: none; padding: 18px 30px; border-radius: 50px; color: #000; font-size: 1.1rem; font-weight: 900; cursor: pointer; width: 100%; max-width: 320px; margin-bottom: 15px; text-transform: uppercase; }
        .btn-outline { background: var(--glass-bg); border: 2px solid var(--glass-border); color: #fff; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: 20px; }
        .shop-item { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 15px; border-radius: 15px; cursor: pointer; }
        .shop-item.equipped { border-color: var(--brand-gold); background: rgba(245, 183, 0, 0.1); }
        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #1e232d; border-left: 5px solid var(--brand-gold); padding: 15px; border-radius: 8px; z-index: 100; min-width: 250px; }
    </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="toast-container"></div>
    <div id="ui-layer">
        <div class="hud" id="hud">
            <div>
                <div style="font-size: 0.8rem; opacity: 0.7;">SCORE</div>
                <div class="score-val" id="scoreVal">0</div>
                <div style="color: var(--brand-orange); font-size: 0.9rem;">🪙 <span id="graceCoinsVal">0</span></div>
            </div>
            <div style="text-align: right;">
                <div id="livesVal" style="font-size: 1.5rem;">❤️❤️❤️</div>
                <button class="btn-outline" id="btnPauseHUD" style="padding: 5px 10px; border-radius: 5px; margin-top: 5px;">PAUSE</button>
            </div>
        </div>
        <div class="screen active" id="startScreen">
            <h1 style="margin-bottom: 10px;">BLESSING BASKET</h1>
            <div style="margin-bottom: 20px;">🪙 <span id="menuCoins">0</span> Grace Coins</div>
            <button class="btn" id="startBtn">START MISSION</button>
            <button class="btn btn-outline" id="btnOpenShop">🛒 THE SHOP</button>
            <button class="btn btn-outline" id="btnOpenSettings">⚙️ SETTINGS</button>
        </div>
        <div class="screen" id="shopScreen">
            <h1>THE SHOP</h1>
            <div style="margin-bottom: 10px;">🪙 <span id="shopCoins">0</span></div>
            <div class="shop-grid" id="shopSkinsGrid"></div>
            <button class="btn btn-outline" id="btnCloseShop" style="margin-top: 20px;">BACK</button>
        </div>
        <div class="screen" id="settingsScreen">
            <h1>SETTINGS</h1>
            <div style="width: 100%; max-width: 300px; text-align: left;">
                <p>Master Volume</p>
                <input type="range" id="volMaster" style="width: 100%; margin-bottom: 20px;">
                <p>Move Left: <span id="bindLeft" style="color: var(--brand-gold);">A</span></p>
                <p>Move Right: <span id="bindRight" style="color: var(--brand-gold);">D</span></p>
            </div>
            <button class="btn" id="btnResume" style="display: none;">RESUME</button>
            <button class="btn btn-outline" id="btnCloseSettings">CLOSE</button>
        </div>
        <div class="screen" id="endScreen">
            <h2>MATCH OVER</h2>
            <div class="score-val" id="finalScore" style="font-size: 4rem;">0</div>
            <div style="margin-bottom: 20px;">+<span id="earnedCoins">0</span> Coins Earned</div>
            <button class="btn" id="playAgainBtn">PLAY AGAIN</button>
            <button class="btn btn-outline" id="btnEndToMenu">MENU</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyB1aO-MszyfLTz11uru-IyRw2zIRCEuexU", authDomain: "blessing-basket.firebaseapp.com", projectId: "blessing-basket", storageBucket: "blessing-basket.firebasestorage.app", messagingSenderId: "558241052507", appId: "1:558241052507:web:4ba95c9dc1e6695e364c7e" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

const CONFIG = {
    physics: { gravity: 650, basketSpeed: 1900, basketFriction: 0.82, basketMaxSpeed: 950, itemSpeedMin: 200, difficultyTime: 100 },
    gameplay: { maxLives: 3, points: 10, foilChance: 0.05, powerupChance: 0.04 },
    shop: [
        { id: 'skin_classic', name: 'Classic Gold', price: 0, color: '#f5b700' },
        { id: 'skin_forged', name: 'Forged Steel', price: 500, color: '#788594' },
        { id: 'skin_neon', name: 'Neon Pulse', price: 1500, color: '#00e5ff' }
    ],
    items: {
        good: [{t:'Prayer', e:'🙏'}, {t:'Hope', e:'🌟'}, {t:'Grace', e:'✨'}],
        bad: [{t:'Gossip', e:'🗣️'}, {t:'Fear', e:'😨'}],
        powers: [{id:'shield', t:'Shield', e:'🛡️', c:'#00e5ff'}, {id:'magnet', t:'Magnet', e:'🧲', c:'#b300ff'}]
    }
};

class SaveSystem {
    constructor() {
        this.data = JSON.parse(localStorage.getItem('bb_save')) || { currency: 0, inventory: ['skin_classic'], skin: 'skin_classic', highScore: 0 };
    }
    save() { localStorage.setItem('bb_save', JSON.stringify(this.data)); }
}
const Save = new SaveSystem();

class AudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    }
    init() { if(this.ctx.state === 'suspended') this.ctx.resume(); }
    play(f, d=0.2) {
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.frequency.setValueAtTime(f, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
        o.connect(g); g.connect(this.master); o.start(); o.stop(this.ctx.currentTime + d);
    }
}
const Audio = new AudioEngine();

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas'); this.ctx = this.canvas.getContext('2d');
        this.state = 'MENU'; this.items = []; this.particles = []; this.lastTime = 0;
        this.score = 0; this.lives = 0; this.coins = 0; this.survivalTime = 0; this.spawnTimer = 0;
        this.input = { axis: 0, touch: null };
        this.setupInput(); this.resize(); this.renderShop(); this.updateUI();
        window.addEventListener('resize', () => this.resize());
        requestAnimationFrame(t => this.loop(t));

        document.getElementById('startBtn').onclick = () => this.start();
        document.getElementById('playAgainBtn').onclick = () => this.start();
        document.getElementById('btnOpenShop').onclick = () => this.showScreen('shopScreen');
        document.getElementById('btnCloseShop').onclick = () => this.showScreen('startScreen');
        document.getElementById('btnOpenSettings').onclick = () => this.showScreen('settingsScreen');
        document.getElementById('btnCloseSettings').onclick = () => this.showScreen('startScreen');
    }

    setupInput() {
        window.onkeydown = e => { if(e.key.toLowerCase()==='a') this.input.axis=-1; if(e.key.toLowerCase()==='d') this.input.axis=1; };
        window.onkeyup = e => this.input.axis=0;
        this.canvas.ontouchstart = e => this.input.touch = e.touches[0].clientX;
        this.canvas.ontouchmove = e => this.input.touch = e.touches[0].clientX;
        this.canvas.ontouchend = () => this.input.touch = null;
    }

    resize() {
        this.width = this.canvas.clientWidth; this.height = this.canvas.clientHeight;
        this.canvas.width = this.width * window.devicePixelRatio; this.canvas.height = this.height * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    start() {
        Audio.init(); this.state = 'PLAYING'; this.score = 0; this.lives = CONFIG.gameplay.maxLives;
        this.coins = 0; this.survivalTime = 0; this.items = [];
        this.basket = { x: this.width/2 - 55, w: 110, h: 30, color: CONFIG.shop.find(s=>s.id===Save.data.skin).color };
        this.showScreen('hud'); document.getElementById('hud').classList.add('active');
    }

    showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if(id !== 'hud') document.getElementById(id).classList.add('active');
    }

    renderShop() {
        const g = document.getElementById('shopSkinsGrid'); g.innerHTML = '';
        CONFIG.shop.forEach(s => {
            const owned = Save.data.inventory.includes(s.id);
            const div = document.createElement('div'); div.className = `shop-item ${Save.data.skin===s.id?'equipped':''}`;
            div.innerHTML = `<div style="background:${s.color}; height:20px; border-radius:5px;"></div><p>${s.name}</p><p>${owned?'OWNED':'🪙 '+s.price}</p>`;
            div.onclick = () => {
                if(!owned && Save.data.currency >= s.price) { Save.data.currency -= s.price; Save.data.inventory.push(s.id); Save.data.skin=s.id; }
                else if(owned) Save.data.skin = s.id; Save.save(); this.renderShop(); this.updateUI();
            };
            g.appendChild(div);
        });
    }

    updateUI() {
        document.getElementById('menuCoins').innerText = Save.data.currency;
        document.getElementById('shopCoins').innerText = Save.data.currency;
        document.getElementById('graceCoinsVal').innerText = Save.data.currency + this.coins;
        document.getElementById('scoreVal').innerText = this.score;
        document.getElementById('livesVal').innerText = '❤️'.repeat(this.lives);
    }

    loop(ts) {
        if(!this.lastTime) { this.lastTime = ts; requestAnimationFrame(t=>this.loop(t)); return; }
        let dt = (ts - this.lastTime)/1000; if(dt > 0.1) dt = 0.1; this.lastTime = ts;

        if(this.state === 'PLAYING') {
            this.survivalTime += dt; this.spawnTimer += dt;
            
            // Basket Physics
            if(this.input.touch) this.basket.x += (this.input.touch - this.basket.w/2 - this.basket.x) * 0.2;
            else this.basket.x += this.input.axis * 10;
            this.basket.x = Math.max(0, Math.min(this.width - this.basket.w, this.basket.x));

            // Spawning
            if(this.spawnTimer > 1) {
                const isGood = Math.random() > 0.3;
                const list = isGood ? CONFIG.items.good : CONFIG.items.bad;
                const d = list[Math.floor(Math.random()*list.length)];
                this.items.push({ x: Math.random()*(this.width-100), y:-50, isGood, txt: d.e + ' ' + d.t });
                this.spawnTimer = 0;
            }

            // Item Physics & Collision
            this.items.forEach((it, i) => {
                it.y += 5;
                if(it.y > this.height) this.items.splice(i, 1);
                if(it.x < this.basket.x + this.basket.w && it.x + 100 > this.basket.x && it.y + 40 > this.height - 110) {
                    if(it.isGood) { this.score += 10; this.coins += 1; Audio.play(440); }
                    else { this.lives--; Audio.play(110); if(this.lives<=0) { this.state='END'; this.showScreen('endScreen'); document.getElementById('finalScore').innerText=this.score; document.getElementById('earnedCoins').innerText=this.coins; Save.data.currency+=this.coins; Save.save(); } }
                    this.items.splice(i, 1); this.updateUI();
                }
            });
        }

        this.draw();
        requestAnimationFrame(t => this.loop(t));
    }

    draw() {
        this.ctx.clearRect(0,0,this.width,this.height);
        if(this.state === 'PLAYING') {
            this.ctx.fillStyle = this.basket.color; this.ctx.fillRect(this.basket.x, this.height-110, this.basket.w, this.basket.h);
            this.items.forEach(it => {
                this.ctx.fillStyle = it.isGood ? '#fff' : '#ff4444';
                this.ctx.font = '14px Montserrat'; this.ctx.fillText(it.txt, it.x, it.y);
            });
        }
    }
}
new Game();
</script>
</body>
</html>

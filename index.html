<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blessing Basket Arcade | The Foundery Church</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-light: #2a313c;
            --brand-orange: #d96c06;
            --brand-orange-glow: rgba(217, 108, 6, 0.6);
            --brand-gold: #f5b700;
            --brand-gold-glow: rgba(245, 183, 0, 0.5);
            --brand-cream: #fdfbf7;
            --brand-cream-dim: rgba(253, 251, 247, 0.7);
            --bad-red: #cc0000;
            --bad-dark: #1e1414;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            
            --skin-classic: #f5b700;
            --skin-forged: #788594;
            --skin-neon: #00f3ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; touch-action: none; color: var(--brand-cream); }

        #game-wrapper {
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: 600px;
            background: radial-gradient(circle at top, var(--bg-light) 0%, var(--bg-dark) 100%);
            overflow: hidden; box-shadow: 0 0 100px rgba(0, 0, 0, 0.5); transition: background 0.5s ease;
        }

        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* HUD Improvements */
        .hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            font-weight: 800; opacity: 0; transition: all 0.5s ease;
        }
        .hud.active { opacity: 1; transform: translateY(0); }

        .mission-panel {
            background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 10px 15px;
            border-radius: 12px; backdrop-filter: blur(5px); min-width: 140px; margin-bottom: 10px;
        }
        .mission-title { font-size: 0.65rem; color: var(--brand-orange); letter-spacing: 1px; margin-bottom: 3px; }
        .mission-desc { font-size: 0.8rem; line-height: 1.2; }

        .meter-container { 
            position: relative; width: 60px; height: 60px; pointer-events: auto; cursor: pointer; 
            margin-top: 10px; transition: transform 0.2s;
        }
        .meter-container:active { transform: scale(0.9); }
        .meter-svg { transform: rotate(-90deg); }
        .meter-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 6; }
        .meter-fill { fill: none; stroke: var(--brand-gold); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.3s; }
        .meter-icon { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 20px; text-shadow: 0 0 10px var(--brand-gold);
        }
        .meter-full { animation: pulse-gold 1s infinite; }
        @keyframes pulse-gold { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* General Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 17, 21, 0.96); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 30px; text-align: center;
            opacity: 0; pointer-events: none; transition: all 0.4s ease; transform: scale(1.1);
            backdrop-filter: blur(15px); overflow-y: auto;
        }
        .screen.active { opacity: 1; pointer-events: auto; transform: scale(1); }

        h1 { color: var(--brand-cream); font-size: 2.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 30px var(--brand-orange-glow); }
        .btn {
            background: linear-gradient(135deg, var(--brand-gold) 0%, var(--brand-orange) 100%);
            border: none; padding: 18px 40px; border-radius: 50px; color: #000;
            font-size: 1.1rem; font-weight: 900; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 2px; width: 100%; max-width: 320px; margin-bottom: 15px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-outline { background: var(--glass-bg); border: 2px solid var(--glass-border); color: #fff; }

        /* Level Up Upgrade Choices */
        .upgrade-grid { display: grid; gap: 15px; width: 100%; max-width: 400px; margin-top: 20px; }
        .upgrade-card { 
            background: var(--glass-bg); border: 2px solid var(--glass-border); padding: 15px; 
            border-radius: 16px; cursor: pointer; transition: 0.2s; pointer-events: auto;
        }
        .upgrade-card:hover { border-color: var(--brand-gold); background: rgba(245, 183, 0, 0.1); }
        .upgrade-card h4 { color: var(--brand-gold); margin-bottom: 5px; text-transform: uppercase; }
        .upgrade-card p { font-size: 0.85rem; opacity: 0.8; margin-bottom: 0; }

        /* Event Text Animation */
        #event-announcer {
            position: absolute; top: 40%; width: 100%; text-align: center;
            font-size: 3rem; font-weight: 900; color: #fff; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.5); pointer-events: none;
            opacity: 0; transform: scale(0.5); z-index: 20;
        }
        .announce-active { animation: announce-anim 2s forwards; }
        @keyframes announce-anim {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Countdown */
        #countdown {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8rem; font-weight: 900; color: var(--brand-gold);
            text-shadow: 0 0 50px var(--brand-gold-glow); pointer-events: none; z-index: 30;
        }

        /* Customization UI */
        .customization-panel { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 15px; padding: 15px; margin-bottom: 25px; width: 100%; max-width: 320px; }
        .skin-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .skin-btn { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.2s; opacity: 0.5; }
        .skin-btn.active { border-color: var(--brand-cream); opacity: 1; transform: scale(1.1); }
        .skin-btn.locked::after { content: '🔒'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; }
        .bg-classic { background: var(--skin-classic); }
        .bg-forged { background: var(--skin-forged); }
        .bg-neon { background: var(--skin-neon); }

        select.modifier-select {
            width: 100%; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            color: var(--brand-cream); font-family: 'Montserrat', sans-serif; font-weight: 600; outline: none; text-align: center;
        }

        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="flash-overlay"></div>
    <div id="event-announcer"></div>
    <div id="countdown"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud" id="hud">
            <div class="hud-left">
                <div class="mission-panel">
                    <div class="mission-title">ACTIVE MISSION</div>
                    <div class="mission-desc" id="missionDesc">Catch 3 Prayers</div>
                    <div style="font-size: 0.7rem; margin-top: 5px; color: var(--brand-gold);" id="missionProgress">0 / 3</div>
                </div>
                <div class="score-box">SCORE <span class="score-val" id="scoreVal">0</span></div>
                <div class="streak-box" id="streakVal">Streak: 0</div>
            </div>
            
            <div class="hud-right">
                <div class="lives-val" id="livesVal">❤️❤️❤️</div>
                <div class="meter-container" id="burstBtn">
                    <svg class="meter-svg" width="60" height="60">
                        <circle class="meter-bg" cx="30" cy="30" r="26"></circle>
                        <circle class="meter-fill" id="meterFill" cx="30" cy="30" r="26" stroke-dasharray="163.36" stroke-dashoffset="163.36"></circle>
                    </svg>
                    <div class="meter-icon" id="meterIcon">✨</div>
                </div>
            </div>
        </div>

        <div class="screen active" id="startScreen">
            <h1>Blessing Basket</h1>
            <div class="customization-panel">
                <h3>Select Skin</h3>
                <div class="skin-selector">
                    <div class="skin-btn bg-classic active" data-skin="classic"></div>
                    <div class="skin-btn bg-forged locked" data-skin="forged" id="skinForged"></div>
                    <div class="skin-btn bg-neon locked" data-skin="neon" id="skinNeon"></div>
                </div>
                <h3>Modifier</h3>
                <select id="banSelect" class="modifier-select">
                    <option value="none">Standard Play</option>
                </select>
            </div>
            <button class="btn" id="startBtn">START ARCADE</button>
            <button class="btn btn-outline" id="lbStartBtn">LEADERBOARD</button>
        </div>

        <div class="screen" id="upgradeScreen">
            <h1 style="color: var(--brand-gold);">LEVEL UP!</h1>
            <p>Choose your blessing upgrade:</p>
            <div class="upgrade-grid" id="upgradeGrid"></div>
        </div>

        <div class="screen" id="endScreen">
            <div class="final-score" id="finalScore">0</div>
            <div id="highScoreDisplay">PB: <span id="highScoreVal">0</span></div>
            <div id="submitScoreBlock" style="width: 100%; max-width: 320px; margin-top: 15px;">
                <input type="text" id="playerNameInput" placeholder="YOUR NAME" maxlength="15">
                <button class="btn" id="submitScoreBtn" style="margin-top: 10px;">SUBMIT SCORE</button>
            </div>
            <div class="challenge-card">
                <div class="challenge-label">THIS WEEK'S CHALLENGE:</div>
                <div class="challenge-text" id="challengeText">...</div>
            </div>
            <button class="btn" id="playAgainBtn">PLAY AGAIN</button>
            <button class="btn btn-outline" id="lbEndBtn">LEADERBOARD</button>
        </div>

        <div class="screen" id="leaderboardScreen">
            <h1>TOP BLESSERS</h1>
            <div id="leaderboardList"></div>
            <button class="btn btn-outline" id="lbCloseBtn" style="margin-top: 20px;">BACK</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyB1aO-MszyfLTz11uru-IyRw2zIRCEuexU",
    authDomain: "blessing-basket.firebaseapp.com",
    projectId: "blessing-basket",
    storageBucket: "blessing-basket.firebasestorage.app",
    messagingSenderId: "558241052507",
    appId: "1:558241052507:web:4ba95c9dc1e6695e364c7e",
    measurementId: "G-8495PL9SH8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================================================================
// CONFIG & CONSTANTS
// ============================================================================
const GAME_CONFIG = {
    physics: { gravity: 600, basketSpeed: 1800, basketFriction: 0.8, basketMaxSpeed: 900, touchFollowSpeed: 18, baseFallSpeed: 250 },
    rules: { maxLives: 3, pointsPerGood: 10, comboSequence: ['Prayer', 'Hope', 'Grace'] },
    colors: {
        good: '#fdfbf7', bad: '#1e1414', gold: '#f5b700', shield: '#00e5ff', 
        slow: '#00ff88', double: '#ff00ff', magnet: '#ffaa00'
    },
    items: {
        good: [
            { t: 'Prayer', e: '🙏' }, { t: 'Hope', e: '🌟' }, { t: 'Grace', e: '✨' },
            { t: 'Kindness', e: '🤝' }, { t: 'Love', e: '❤️' }, { t: 'Coffee', e: '☕' }
        ],
        bad: [
            { t: 'Gossip', e: '🗣️' }, { t: 'Fear', e: '😨' }, { t: 'Stress', e: '😖' }, { t: 'Anger', e: '😡' }
        ],
        powers: [
            { id: 'shield', t: 'Shield', e: '🛡️', c: '#00e5ff' },
            { id: 'slow', t: 'Slow Time', e: '⏳', c: '#00ff88' },
            { id: 'double', t: 'Double Pts', e: '✝️', c: '#ff00ff' },
            { id: 'magnet', t: 'Magnet', e: '🧲', c: '#ffaa00' }
        ]
    },
    upgrades: [
        { id: 'width', t: 'Wider Basket', d: 'Increase basket size by 15%' },
        { id: 'life', t: 'Extra Life', d: 'Add one heart to your lives' },
        { id: 'slowBad', t: 'Slower Storm', d: 'Bad items fall 20% slower' },
        { id: 'multiplier', t: 'More Points', d: 'Get 5 extra points per catch' },
        { id: 'foil', t: 'Foil Luck', d: 'Higher chance of special items' }
    ],
    challenges: [
        "Text someone you haven't checked on.",
        "Bring someone a coffee today.",
        "Donate to Kenny's Kloset.",
        "Invite a friend to church."
    ]
};

// ============================================================================
// CORE ENGINES
// ============================================================================
class AudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    }
    init() { if (this.ctx.state === 'suspended') this.ctx.resume(); }
    play(freq, type = 'sine', dur = 0.2, vol = 0.1) {
        const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(g); g.connect(this.master); osc.start(); osc.stop(this.ctx.currentTime + dur);
    }
    good() { this.play(600, 'sine'); setTimeout(()=>this.play(800), 50); }
    bad() { this.play(150, 'sawtooth', 0.4, 0.2); }
    power() { [400, 500, 600, 800].forEach((f, i) => setTimeout(() => this.play(f, 'square', 0.2, 0.05), i * 100)); }
    burst() { this.play(200, 'sine', 0.8, 0.3); }
}

class ParticleSystem {
    constructor() { this.particles = []; this.texts = []; }
    burst(x, y, color, count = 12) {
        for(let i=0; i<count; i++) {
            this.particles.push({ 
                x, y, vx: (Math.random()-0.5)*400, vy: (Math.random()-0.5)*400-100, 
                life: 1, color, size: Math.random()*5+2 
            });
        }
    }
    floatText(x, y, txt, color) { this.texts.push({ x, y, txt, color, life: 1, vy: -50 }); }
    update(dt) {
        this.particles.forEach((p, i) => {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 800 * dt; p.life -= dt * 1.5;
            if(p.life <= 0) this.particles.splice(i, 1);
        });
        this.texts.forEach((t, i) => {
            t.y += t.vy * dt; t.life -= dt;
            if(t.life <= 0) this.texts.splice(i, 1);
        });
    }
    draw(ctx) {
        this.particles.forEach(p => {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        this.texts.forEach(t => {
            ctx.globalAlpha = t.life; ctx.fillStyle = t.color;
            ctx.font = "bold 20px Montserrat"; ctx.textAlign = "center";
            ctx.fillText(t.txt, t.x, t.y);
        });
        ctx.globalAlpha = 1;
    }
}

// ============================================================================
// GAME LOGIC
// ============================================================================
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioEngine();
        this.particles = new ParticleSystem();
        
        this.state = 'MENU';
        this.score = 0; this.lives = 3; this.streak = 0;
        this.survivalTime = 0; this.lastTime = 0;
        
        this.items = []; this.basket = null;
        this.input = { axis: 0, touch: null };
        this.upgrades = { width: 1, fallSpeed: 1, points: 0, powerDur: 1, foil: 0 };
        
        this.burstMeter = 0; this.activeEvent = null; this.eventTimer = 0;
        this.activePowers = { shield: false, slow: 0, double: 0, magnet: 0 };
        this.mission = null; this.nextLevelGate = 150;
        
        this.bindUI(); this.resize();
        window.addEventListener('resize', () => this.resize());
        requestAnimationFrame(t => this.loop(t));
    }

    bindUI() {
        document.getElementById('startBtn').onclick = () => this.startCountdown();
        document.getElementById('burstBtn').onclick = () => this.activateBurst();
        document.getElementById('playAgainBtn').onclick = () => this.startCountdown();
        document.getElementById('lbStartBtn').onclick = () => this.showLeaderboard();
        document.getElementById('lbEndBtn').onclick = () => this.showLeaderboard();
        document.getElementById('lbCloseBtn').onclick = () => this.showScreen('startScreen');
        document.getElementById('submitScoreBtn').onclick = () => this.submitScore();

        window.onkeydown = e => {
            if(e.key.toLowerCase() === 'a') this.input.axis = -1;
            if(e.key.toLowerCase() === 'd') this.input.axis = 1;
            if(e.key === ' ') this.activateBurst();
        };
        window.onkeyup = () => this.input.axis = 0;
        this.canvas.addEventListener('touchstart', e => this.input.touch = e.touches[0].clientX, {passive: false});
        this.canvas.addEventListener('touchmove', e => this.input.touch = e.touches[0].clientX, {passive: false});
        this.canvas.addEventListener('touchend', () => this.input.touch = null);
        
        // Skin setup
        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.onclick = (e) => {
                if(e.target.classList.contains('locked')) return;
                document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.activeSkin = e.target.dataset.skin;
            };
        });
    }

    resize() {
        this.width = this.canvas.clientWidth;
        this.height = this.canvas.clientHeight;
        this.canvas.width = this.width * window.devicePixelRatio;
        this.canvas.height = this.height * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if(id) document.getElementById(id).classList.add('active');
    }

    startCountdown() {
        this.audio.init();
        this.showScreen(null);
        let count = 3;
        const cdEl = document.getElementById('countdown');
        const itv = setInterval(() => {
            cdEl.innerText = count > 0 ? count : 'GO!';
            if(count < 0) {
                clearInterval(itv); cdEl.innerText = '';
                this.initGame();
            }
            count--;
        }, 800);
    }

    initGame() {
        this.state = 'PLAYING'; this.score = 0; this.lives = 3; this.streak = 0;
        this.survivalTime = 0; this.burstMeter = 0; this.items = [];
        this.nextLevelGate = 150; this.activeEvent = null;
        this.upgrades = { width: 1, fallSpeed: 1, points: 0, powerDur: 1, foil: 0 };
        this.activePowers = { shield: false, slow: 0, double: 0, magnet: 0 };
        
        const skin = this.activeSkin || 'classic';
        const color = skin === 'neon' ? '#00f3ff' : (skin === 'forged' ? '#788594' : '#f5b700');
        this.basket = { x: this.width/2 - 55, w: 110, h: 30, color };
        
        this.setNewMission();
        document.getElementById('hud').classList.add('active');
        this.updateHUD();
    }

    setNewMission() {
        const missions = [
            { t: 'Catch 3 Prayers', goal: 3, cur: 0, type: 'catch', target: 'Prayer' },
            { t: 'Catch 8 Good Items', goal: 8, cur: 0, type: 'catch_any' },
            { t: 'Reach a 10 Streak', goal: 10, cur: 0, type: 'streak' },
            { t: 'Avoid Bad items for 10s', goal: 10, cur: 0, type: 'time_avoid' }
        ];
        this.mission = missions[Math.floor(Math.random()*missions.length)];
        document.getElementById('missionDesc').innerText = this.mission.t;
        this.updateHUD();
    }

    updateMission(type, val) {
        if(!this.mission) return;
        if(this.mission.type === type) {
            if(type === 'catch' && val === this.mission.target) this.mission.cur++;
            if(type === 'catch_any') this.mission.cur++;
            if(type === 'streak') this.mission.cur = Math.max(this.mission.cur, val);
            
            if(this.mission.cur >= this.mission.goal) {
                this.score += 50; this.audio.power();
                this.particles.floatText(this.width/2, 150, "MISSION COMPLETE! +50", '#00ff88');
                this.setNewMission();
            }
        }
        this.updateHUD();
    }

    activateBurst() {
        if(this.burstMeter < 100 || this.state !== 'PLAYING') return;
        this.burstMeter = 0; this.audio.burst(); this.flash();
        this.items.forEach(it => {
            if(!it.isGood) {
                it.dead = true; this.score += 5;
                this.particles.burst(it.x, it.y, '#fff');
            }
        });
        this.particles.floatText(this.width/2, this.height/2, "BLESSING BURST!", '#f5b700');
        this.updateHUD();
    }

    flash() {
        const f = document.getElementById('flash-overlay');
        f.style.opacity = 0.5;
        setTimeout(() => f.style.opacity = 0, 200);
    }

    triggerLevelUp() {
        this.state = 'PAUSED';
        this.showScreen('upgradeScreen');
        const grid = document.getElementById('upgradeGrid');
        grid.innerHTML = '';
        
        // Pick 3 random upgrades
        const pool = [...GAME_CONFIG.upgrades].sort(() => 0.5 - Math.random()).slice(0,3);
        pool.forEach(u => {
            const card = document.createElement('div');
            card.className = 'upgrade-card';
            card.innerHTML = `<h4>${u.t}</h4><p>${u.d}</p>`;
            card.onclick = () => this.applyUpgrade(u.id);
            grid.appendChild(card);
        });
    }

    applyUpgrade(id) {
        if(id === 'width') this.basket.w *= 1.15;
        if(id === 'life') { this.lives++; this.audio.good(); }
        if(id === 'slowBad') this.upgrades.fallSpeed *= 0.8;
        if(id === 'multiplier') this.upgrades.points += 5;
        if(id === 'foil') this.upgrades.foil += 0.05;
        
        this.nextLevelGate += 150;
        this.state = 'PLAYING';
        this.showScreen(null);
        this.updateHUD();
    }

    announceEvent(txt) {
        const el = document.getElementById('event-announcer');
        el.innerText = txt;
        el.classList.remove('announce-active');
        void el.offsetWidth; // Trigger reflow
        el.classList.add('announce-active');
    }

    spawnItem() {
        let type = Math.random();
        let item = {};

        // Power-up spawn (rare)
        if(type < 0.04 + this.upgrades.foil) {
            const p = GAME_CONFIG.items.powers[Math.floor(Math.random()*GAME_CONFIG.items.powers.length)];
            item = { x: Math.random()*(this.width-60)+30, y: -50, txt: p.e + ' ' + p.t, isGood: true, isPower: true, pId: p.id, c: p.c };
        } else if (type < 0.35) {
            const d = GAME_CONFIG.items.bad[Math.floor(Math.random()*GAME_CONFIG.items.bad.length)];
            item = { x: Math.random()*(this.width-60)+30, y: -50, txt: d.e + ' ' + d.t, isGood: false, c: '#ff4444' };
        } else {
            const d = GAME_CONFIG.items.good[Math.floor(Math.random()*GAME_CONFIG.items.good.length)];
            item = { x: Math.random()*(this.width-60)+30, y: -50, txt: d.e + ' ' + d.t, isGood: true, c: '#fff', t: d.t };
        }
        
        item.vy = (GAME_CONFIG.physics.baseFallSpeed + (this.survivalTime * 2)) * (!item.isGood ? this.upgrades.fallSpeed : 1);
        if(this.activePowers.slow > 0) item.vy *= 0.5;
        
        this.items.push(item);
    }

    updateHUD() {
        document.getElementById('scoreVal').innerText = this.score;
        document.getElementById('livesVal').innerText = '❤️'.repeat(this.lives);
        document.getElementById('streakVal').innerText = `Streak: ${this.streak}`;
        
        const offset = 163.36 - (this.burstMeter / 100 * 163.36);
        const fill = document.getElementById('meterFill');
        fill.style.strokeDashoffset = offset;
        document.getElementById('meterIcon').classList.toggle('meter-full', this.burstMeter >= 100);
        
        if(this.mission) {
            document.getElementById('missionProgress').innerText = `${this.mission.cur} / ${this.mission.goal}`;
        }
    }

    loop(ts) {
        let dt = (ts - this.lastTime) / 1000;
        if(dt > 0.1) dt = 0.1;
        this.lastTime = ts;

        if(this.state === 'PLAYING') {
            this.survivalTime += dt;
            this.spawnTimer = (this.spawnTimer || 0) + dt;

            // Power-down timers
            if(this.activePowers.slow > 0) this.activePowers.slow -= dt;
            if(this.activePowers.double > 0) this.activePowers.double -= dt;
            if(this.activePowers.magnet > 0) this.activePowers.magnet -= dt;

            // Random Events
            if(Math.random() < 0.002 && !this.activeEvent) {
                const events = ['Grace Rush', 'Gossip Storm', 'Forge Fire'];
                this.activeEvent = events[Math.floor(Math.random()*events.length)];
                this.announceEvent(this.activeEvent);
                setTimeout(() => this.activeEvent = null, 8000);
            }

            // Input
            if(this.input.touch) this.basket.x += (this.input.touch - this.basket.w/2 - this.basket.x) * 0.2;
            else this.basket.x += this.input.axis * 12;
            this.basket.x = Math.max(0, Math.min(this.width - this.basket.w, this.basket.x));

            // Spawning
            let rate = Math.max(0.3, 0.9 - (this.survivalTime / 60));
            if(this.activeEvent === 'Grace Rush') rate = 0.2;
            if(this.spawnTimer > rate) {
                this.spawnItem();
                this.spawnTimer = 0;
            }

            // Collisions
            this.items.forEach((it, i) => {
                // Magnet logic
                if(this.activePowers.magnet > 0 && it.isGood) {
                    it.x += (this.basket.x + this.basket.w/2 - it.x) * 2 * dt;
                }

                it.y += it.vy * dt;
                if(it.y > this.height) this.items.splice(i, 1);

                if(it.x < this.basket.x + this.basket.w && it.x + 30 > this.basket.x && it.y + 30 > this.height - 110) {
                    this.handleCatch(it);
                    this.items.splice(i, 1);
                }
            });

            if(this.score >= this.nextLevelGate) this.triggerLevelUp();
        }

        this.draw();
        requestAnimationFrame(t => this.loop(t));
    }

    handleCatch(it) {
        if(it.isPower) {
            this.audio.power(); this.flash();
            this.activePowers[it.pId] = it.pId === 'shield' ? true : 8 * this.upgrades.powerDur;
            this.particles.floatText(it.x, it.y, it.pId.toUpperCase(), it.c);
        } else if(it.isGood) {
            this.audio.good(); this.streak++;
            let p = (GAME_CONFIG.rules.pointsPerGood + this.upgrades.points);
            if(this.activePowers.double > 0) p *= 2;
            this.score += p;
            this.burstMeter = Math.min(100, this.burstMeter + 5);
            this.particles.burst(it.x, it.y, '#f5b700');
            this.particles.floatText(it.x, it.y, `+${p}`, '#f5b700');
            this.updateMission('catch', it.t);
            this.updateMission('catch_any');
            this.updateMission('streak', this.streak);
        } else {
            if(this.activePowers.shield) {
                this.activePowers.shield = false; this.audio.power();
                this.particles.floatText(it.x, it.y, "SHIELDED", '#00e5ff');
            } else {
                this.audio.bad(); this.lives--; this.streak = 0;
                this.particles.burst(it.x, it.y, '#ff0000', 20);
                if(this.lives <= 0) this.endGame();
            }
        }
        this.updateHUD();
    }

    endGame() {
        this.state = 'END';
        this.showScreen('endScreen');
        document.getElementById('finalScore').innerText = this.score;
        const pb = StorageManager.getHighScore();
        if(this.score > pb) StorageManager.setHighScore(this.score);
        document.getElementById('highScoreVal').innerText = Math.max(this.score, pb);
        document.getElementById('challengeText').innerText = GAME_CONFIG.challenges[Math.floor(Math.random()*GAME_CONFIG.challenges.length)];
    }

    draw() {
        this.ctx.clearRect(0,0,this.width,this.height);
        if(this.state === 'PLAYING' || this.state === 'PAUSED') {
            // Draw Basket
            this.ctx.save();
            this.ctx.shadowBlur = this.activePowers.shield ? 20 : 10;
            this.ctx.shadowColor = this.activePowers.shield ? '#00e5ff' : '#000';
            this.ctx.fillStyle = this.basket.color;
            this.ctx.roundRect(this.basket.x, this.height-110, this.basket.w, this.basket.h, 10);
            this.ctx.fill();
            this.ctx.restore();

            // Draw Items
            this.items.forEach(it => {
                this.ctx.save();
                this.ctx.fillStyle = it.c;
                this.ctx.shadowBlur = 10; this.ctx.shadowColor = it.c;
                this.ctx.font = 'bold 16px Montserrat';
                this.ctx.fillText(it.txt, it.x, it.y);
                this.ctx.restore();
            });

            this.particles.draw(this.ctx);
            this.particles.update(0.016);
        }
    }

    async submitScore() {
        const name = document.getElementById('playerNameInput').value.trim() || "Anonymous";
        try {
            await addDoc(collection(db, "scores"), { name, score: this.score, timestamp: serverTimestamp() });
            document.getElementById('submitScoreBlock').style.display = 'none';
            document.getElementById('scoreSavedMsg').style.display = 'block';
        } catch (e) { alert("Error saving score!"); }
    }

    async showLeaderboard() {
        this.showScreen('leaderboardScreen');
        const list = document.getElementById('leaderboardList');
        list.innerHTML = 'Loading...';
        const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(10));
        const snap = await getDocs(q);
        list.innerHTML = '';
        snap.forEach((doc, i) => {
            const d = doc.data();
            list.innerHTML += `<div class="lb-row"><span class="lb-rank">#${i+1}</span><span class="lb-name">${d.name}</span><span class="lb-score">${d.score}</span></div>`;
        });
    }
}

// Storage helper
const StorageManager = {
    getHighScore: () => parseInt(localStorage.getItem('blessingBasketArcadePB')) || 0,
    setHighScore: (s) => localStorage.setItem('blessingBasketArcadePB', s)
};

// Canvas roundRect Polyfill for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
        this.beginPath(); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r); this.closePath(); return this;
    };
}

const game = new Game();
</script>
